<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7f37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5016;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdf00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccaa00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="racketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Tennis court lines suggestion -->
  <g opacity="0.15" stroke="#fff" stroke-width="3" fill="none">
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <ellipse cx="256" cy="256" rx="120" ry="60"/>
  </g>

  <!-- Racket -->
  <g transform="translate(140, 380) rotate(-45)" filter="url(#glow)">
    <!-- Frame -->
    <ellipse cx="0" cy="0" rx="85" ry="55" fill="none" stroke="url(#racketGrad)" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="70" ry="42" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <!-- Strings -->
    <g stroke="#fff" stroke-width="1.5" opacity="0.6">
      <line x1="-65" y1="-35" x2="-65" y2="35"/>
      <line x1="-40" y1="-45" x2="-40" y2="45"/>
      <line x1="-15" y1="-50" x2="-15" y2="50"/>
      <line x1="10" y1="-48" x2="10" y2="48"/>
      <line x1="35" y1="-42" x2="35" y2="42"/>
      <line x1="60" y1="-30" x2="60" y2="30"/>
      <line x1="-75" y1="0" x2="70" y2="0"/>
      <line x1="-70" y1="-20" x2="65" y2="-20"/>
      <line x1="-65" y1="20" x2="60" y2="20"/>
    </g>
    <!-- Handle -->
    <path d="M 70 0 L 140 0 L 140 -8 L 70 -8 Z" fill="#8B4513"/>
    <path d="M 70 0 L 140 0 L 140 8 L 70 8 Z" fill="#654321"/>
    <!-- Butt cap -->
    <circle cx="140" cy="0" r="10" fill="#2d2d2d"/>
    <circle cx="140" cy="0" r="6" fill="#444"/>
  </g>

  <!-- Ball with motion trail -->
  <g transform="translate(370, 140)">
    <!-- Motion blur trail -->
    <g opacity="0.3" filter="url(#glow)">
      <ellipse cx="-30" cy="10" rx="18" ry="12" fill="url(#ballGrad)"/>
      <ellipse cx="-55" cy="22" rx="14" ry="10" fill="url(#ballGrad)"/>
      <ellipse cx="-75" cy="32" rx="10" ry="8" fill="url(#ballGrad)"/>
    </g>
    <!-- Main ball -->
    <circle cx="0" cy="0" r="28" fill="url(#ballGrad)" filter="url(#shadow)"/>
    <!-- Ball seams -->
    <path d="M -28 0 Q 0 -35 28 0 Q 0 35 -28 0" fill="none" stroke="#ccaa00" stroke-width="2.5" opacity="0.8"/>
    <path d="M 0 -28 Q 35 0 0 28 Q -35 0 0 -28" fill="none" stroke="#ccaa00" stroke-width="2.5" opacity="0.6"/>
    <!-- Highlight -->
    <ellipse cx="-8" cy="-8" rx="10" ry="6" fill="#fff" opacity="0.3"/>
  </g>

  <!-- "S" monogram subtle -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, -apple-system" font-size="80" font-weight="700" fill="#fff" opacity="0.12" filter="url(#shadow)">S</text>
</svg>